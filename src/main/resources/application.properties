# -------------------------------------------------------
# Custom DataSource Configuration (replaces spring auto-config)
# -------------------------------------------------------
app.datasource.url=jdbc:postgresql://localhost:5432/test
app.datasource.url2=jdbc:postgresql://localhost:5432/india1
#app.datasource.url=jdbc:postgresql://host.docker.internal:5432/test
app.datasource.username=test
app.datasource.password=terminator
app.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings
app.datasource.hikari.pool-name=AIO-HikariPool
app.datasource.hikari.maximum-pool-size=10
app.datasource.hikari.minimum-idle=2
app.datasource.hikari.idle-timeout=30000
app.datasource.hikari.connection-timeout=20000
app.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate settings (consumed by DatabaseConfig)
app.jpa.show-sql=true
app.jpa.ddl-auto=update
app.jpa.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

spring.rabbitmq.host=fish.rmq.cloudamqp.com
spring.rabbitmq.password=jnkjnkjnkjn
spring.rabbitmq.port=5672
spring.rabbitmq.username=khbkb
spring.rabbitmq.virtual-host=nk
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE

# Enable logging of potentially sensitive request details (like headers/tokens)
spring.codec.log-request-details=true
server.netty.log-request-details=true

# Optional: reactor netty level for wire-level logging
# logging.level.reactor.netty.http.client=DEBUG

# OAuth2 Resource Server Configuration
# Pointing to local Mock OIDC Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/default

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=satish-aio-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.topic=satish-aio-topic
